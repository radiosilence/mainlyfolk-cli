[package]
name = "mainlynorfolk-cli"
version = "0.1.1"
edition = "2024"
description = "CLI and MCP server for the Mainly Norfolk English folk music archive"
repository = "https://github.com/radiosilence/mainlynorfolk-cli"
license = "MIT"
keywords = ["cli", "folk", "music", "ballads", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "folk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-graphql = { version = "7", features = ["dataloader"] }
axum = "0.8"
askama = "0.16"
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5.65"
dirs = "6.0.0"
futures-util = "0.3"
http = "1"
open = "5"
percent-encoding = "2"
reqwest = { version = "0.13.1", default-features = false, features = [
  "form",
  "json",
  "gzip",
  "rustls",
] }
rmcp = { version = "1", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
schemars = "1"
scraper = "0.24"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
